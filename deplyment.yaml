apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deplyment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx-deplyment
        image: nginx:latest
        ports:
        - containerPort: 80        
