apiVersion: /apps/v1
kind: Deplyment
metadata:
  name: nginx-deplyment
spec:
  replicas: 2
  selector:
    matchLabels:
      app:nginx
  template:
    metadata:
      labels:
        app:nginx
    spec:
      containers:
      - name: nginx-deplyment
        image: nginx:latest
        ports:
        - containerPort: 80        
